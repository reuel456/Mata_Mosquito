<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mata Mosquito AI - Cyber Arcade</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <!-- Google MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- Mira Holográfica Rastreada pela Mão -->
    <div id="ponteiro-mao">
        <div class="mira-centro"></div>
    </div>

    <!-- Mini-HUD da Câmera (Preview no Canto Inferior Esquerdo) -->
    <div class="camera-container">
        <video id="webcam" autoplay playsinline></video>
        <span class="status-cam"><span class="dot-rec"></span> AI TRACKING</span>
    </div>

    <!-- TELA INICIAL / MENU DE INÍCIO -->
    <div id="tela-inicial" class="painel-glass">
        <div class="header-titulo">
            <h1 class="glow-text">MATA MOSQUITO <span class="badge-ai">AI EDITION</span></h1>
            <p class="subtitulo">Aponte o indicador para a câmera e elimine as ameaças cibernéticas.</p>
        </div>
        
        <div class="controles-jogo">
            <div class="grupo-input">
                <label for="dificuldade">Nível de Ameaça:</label>
                <select id="dificuldade">
                    <option value="1500">🟢 Normal (1.5s)</option>
                    <option value="1000">🟡 Difícil (1s)</option>
                    <option value="750">🔴 Chuck Norris (0.75s)</option>
                </select>
            </div>
            <button id="btn-iniciar" class="btn-primary" onclick="iniciarJogo()">INICIAR PARTIDA</button>
        </div>

        <!-- SEÇÃO DO RANKING -->
        <div class="secao-ranking">
            <h2>🏆 LEADERBOARD</h2>
            <div class="tabela-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>JOGADOR</th>
                            <th>PONTOS</th>
                            <th>DATA</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-ranking">
                        <!-- Preenchido via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- TELA DO JOGO (HUD + ÁREA DE SPAWN) -->
    <div id="tela-jogo" class="hidden">
        <div class="hud-glass">
            <div class="hud-card">
                <span class="hud-label">VIDAS</span>
                <div class="vidas" id="container-vidas">
                    <span id="v1" class="coracao">❤️</span>
                    <span id="v2" class="coracao">❤️</span>
                    <span id="v3" class="coracao">❤️</span>
                </div>
            </div>

            <div class="hud-card destaque">
                <span class="hud-label">TEMPO</span>
                <div class="hud-valor"><span id="tempo">30</span><small>s</small></div>
            </div>

            <div class="hud-card">
                <span class="hud-label">PONTUAÇÃO</span>
                <div class="hud-valor" id="pontos-atuais">0</div>
            </div>
        </div>

        <div id="palco-jogo"></div>
    </div>

    <!-- MODAL DE GAME OVER -->
    <div id="modal-game-over" class="modal hidden">
        <div class="modal-conteudo-glass">
            <h2 id="titulo-fim" class="glow-text">MISSÃO FINALIZADA!</h2>
            <div class="placar-final">
                <span>PONTUAÇÃO FINAL</span>
                <strong id="pontos-finais">0</strong>
            </div>
            
            <form id="form-ranking" onsubmit="salvarPontuacao(event)">
                <input 
                    type="text" 
                    id="nickname" 
                    placeholder="DIGITE SEU NICKNAME" 
                    maxlength="15" 
                    required 
                    autocomplete="off"
                />
                <button type="submit" id="btn-salvar" class="btn-primary">REGISTRAR RECORDE</button>
            </form>
            
            <button onclick="reiniciarJogo()" class="btn-secondary">VOLTAR AO MENU</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
