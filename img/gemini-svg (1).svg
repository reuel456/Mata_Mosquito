<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Filtros de Brilho Neon (Glow) -->
    <filter id="glow-red" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Gradientes Metálicos -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e3d"/>
      <stop offset="100%" stop-color="#0d0e12"/>
    </linearGradient>
  </defs>

  <!-- Pernas Robóticas -->
  <g stroke="#00f2fe" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 45 55 L 20 40 L 10 50" />
    <path d="M 45 65 L 15 65 L 5 75" />
    <path d="M 45 75 L 25 90 L 15 105" />
    <path d="M 75 55 L 100 40 L 110 50" />
    <path d="M 75 65 L 105 65 L 115 75" />
    <path d="M 75 75 L 95 90 L 105 105" />
  </g>

  <!-- Asas de Energia Neon -->
  <g filter="url(#glow-cyan)">
    <path d="M 50 50 Q 15 10 30 5 Q 60 10 52 45 Z" fill="rgba(0, 242, 254, 0.3)" stroke="#00f2fe" stroke-width="1.5"/>
    <path d="M 70 50 Q 105 10 90 5 Q 60 10 68 45 Z" fill="rgba(0, 242, 254, 0.3)" stroke="#00f2fe" stroke-width="1.5"/>
    <!-- Circuitos das Asas -->
    <path d="M 45 30 L 32 18 M 75 30 L 88 18" stroke="#00f2fe" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- Abdômen Cyberpunk (Corpo) -->
  <ellipse cx="60" cy="80" rx="16" ry="26" fill="url(#bodyGrad)" stroke="#ff007f" stroke-width="1.5"/>
  
  <!-- Anéis de Plasma do Abdômen -->
  <g stroke="#ff007f" stroke-width="2" filter="url(#glow-red)">
    <line x1="48" y1="70" x2="72" y2="70" />
    <line x1="46" y1="80" x2="74" y2="80" />
    <line x1="48" y1="90" x2="72" y2="90" />
  </g>

  <!-- Tórax -->
  <polygon points="50,45 70,45 66,65 54,65" fill="#181a24" stroke="#00f2fe" stroke-width="1.5"/>
  <circle cx="60" cy="55" r="3" fill="#00f2fe" filter="url(#glow-cyan)"/>

  <!-- Cabeça -->
  <circle cx="60" cy="38" r="10" fill="#0d0e12" stroke="#00f2fe" stroke-width="1"/>

  <!-- Olhos Laser -->
  <circle cx="54" cy="36" r="4.5" fill="#ff007f" filter="url(#glow-red)"/>
  <circle cx="66" cy="36" r="4.5" fill="#ff007f" filter="url(#glow-red)"/>
  <circle cx="54" cy="36" r="1.5" fill="#ffffff"/>
  <circle cx="66" cy="36" r="1.5" fill="#ffffff"/>

  <!-- Ferrão Laser / Agulha -->
  <polygon points="59,28 61,28 60,8" fill="#ff007f" filter="url(#glow-red)"/>
</svg>
